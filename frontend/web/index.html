<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Your personal knowledge base for IELTS preparation: weekly documents, vocabulary, sentence patterns and your own wordbook.">
  <meta name="theme-color" content="#800020">

  <!-- Link preview tags (Messenger, Zalo, Facebook, Slack...). Link crawlers
       do not run Flutter, so this information must be in the static HTML.
       og:image should be an absolute URL, e.g. https://<your-domain>/og-image.png -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="IELTS Hub">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="IELTS Hub">
  <meta property="og:description" content="Your personal knowledge base for IELTS preparation: weekly documents, vocabulary, sentence patterns and your own wordbook.">
  <meta property="og:image" content="og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="IELTS Hub logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="IELTS Hub">
  <meta name="twitter:description" content="Your personal knowledge base for IELTS preparation: weekly documents, vocabulary, sentence patterns and your own wordbook.">
  <meta name="twitter:image" content="og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IELTS Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IELTS Hub</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
